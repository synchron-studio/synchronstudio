# Szenen automatisch einbauen: ZIP aus dem Szenen-Editor („Export Scene (.zip)“) auf GitHub
# in den Ordner _import/ hochladen → dieser Ablauf prüft das ZIP, baut die Szene ein,
# testet alles, speichert die Änderung und veröffentlicht die Website neu.
# Klappt etwas nicht, steht der Grund in der Zusammenfassung dieses Laufs und in
# _import/fehlgeschlagen/<name> - FEHLER.txt.
name: Szenen importieren

on:
  push:
    branches: [main]
    paths: ['_import/*.zip', '_import/*.ZIP']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: scene-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Werkzeuge
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)

      - name: Szenen einbauen
        id: import
        # Fehler einzelner ZIPs erst am Ende melden — die anderen sollen trotzdem rein
        continue-on-error: true
        run: node tools/import-scene.cjs

      - name: Spiel testen
        run: npm test

      - name: Speichern
        id: commit
        run: |
          git config user.name "Szenen-Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Szenen-Import: $(git diff --cached --name-only -- 'scenes/*.mp4' | sed 's#scenes/##; s#\.mp4##' | paste -sd ', ' -)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes mit dem Actions-Token starten keine weiteren Abläufe — Website deshalb ausdrücklich neu veröffentlichen
      - name: Website veröffentlichen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "${{ github.repository }}"

      - name: Ergebnis
        if: steps.import.outcome == 'failure'
        run: |
          echo "::error::Mindestens ein ZIP konnte nicht eingebaut werden — Grund siehe Zusammenfassung oben bzw. _import/fehlgeschlagen/"
          exit 1
